<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - 网络安全专家</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            padding: 50px 0;
            border-bottom: 2px solid #e0e0e0;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .section {
            margin: 30px 0;
            padding: 30px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .skill-item {
            padding: 15px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .skill-item:hover {
            transform: translateY(-5px);
        }

        .hobbies {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .hobby-item {
            padding: 15px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .contact {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .contact a {
            color: #000000;
            text-decoration: none;
            font-weight: bold;
        }

        .contact a:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>≡ [About Me] ≡</h1>
            <p>网络安全爱好者 | 技术探索者 | 数据守护者</p>
        </div>

        <div class="section">
            <h2>职业简介</h2>
            <p>专注于网络安全领域的探索与实践，致力于保护数字世界的安宁。</p>
        </div>

        <div class="section">
            <h2>核心技能</h2>
            <div class="skills">
                <div class="skill-item">
                    <h3>防火墙</h3>
                    <p>边界防护专家</p>
                </div>
                <div class="skill-item">
                    <h3>渗透测试</h3>
                    <p>漏洞发现者</p>
                </div>
                <div class="skill-item">
                    <h3>数据加密</h3>
                    <p>信息守护者</p>
                </div>
                <div class="skill-item">
                    <h3>安全审计</h3>
                    <p>系统优化师</p>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>生活中的我</h2>
            <p>在键盘与跑道之间寻找平衡，在技术与健康中找到乐趣。</p>
            <div class="hobbies">
                <div class="hobby-item">
                    <h3>✓ 游泳</h3>
                </div>
                <div class="hobby-item">
                    <h3>✓ 跑步</h3>
                </div>
                <div class="hobby-item">
                    <h3>✓ 打乒乓球</h3>
                </div>
                <div class="hobby-item">
                    <h3>✓ 看书</h3>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Connect With Me</h2>
            <div class="contact">
                <a href="mailto:your.email@example.com">邮箱</a>
                <a href="https://github.com/yourusername">GitHub</a>
                <a href="https://linkedin.com/yourusername">LinkedIn</a>
            </div>
        </div>
    </div>
</body>
</html>
