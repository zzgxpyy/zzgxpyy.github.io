<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - 网络安全技术爱好者</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            padding: 50px 0;
            border-bottom: 2px solid #e0e0e0;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .section {
            margin: 30px 0;
            padding: 30px;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .skills {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .skill-item {
            padding: 15px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .skill-item:hover {
            transform: translateY(-5px);
        }

        .hobbies {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .hobby-item {
            padding: 15px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .contact {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        .contact a {
            color: #000000;
            text-decoration: none;
            font-weight: bold;
        }

        .contact a:hover {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>≡ [About Me] ≡</h1>
            <p>网络安全爱好者 | 运动达人 | 天文爱好者</p>
        </div>

        <div class="section">
            <h2>职业简介</h2>
            <p>就职于某安全公司。</p>
            <p>2009年入行，如今是一名安全技术爱好者，做过安服，做过红队。</p>
            
        </div>

        

        <div class="section">
            <h2>生活中的我</h2>
            <p>在键盘与跑道之间寻找平衡，在技术与健康中找到乐趣。</p>
            <div class="hobbies">
                <div class="hobby-item">
                    <h3>✓ 游泳</h3>
                </div>
                <div class="hobby-item">
                    <h3>✓ 跑步</h3>
                </div>
                <div class="hobby-item">
                    <h3>✓ 打乒乓球</h3>
                </div>
                <div class="hobby-item">
                    <h3>✓ 看书</h3>
                </div>
                <div class="hobby-item">
                    <h3>✓ 写书法</h3>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>Connect With Me</h2>
            <div class="contact">
                <a href="mailto:root@pentestbox.net">邮箱</a>
                <a href="https://github.com/">GitHub</a>    
            </div>
        </div>
    </div>
</body>
</html>
